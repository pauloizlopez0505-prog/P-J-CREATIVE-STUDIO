<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P&J Creative Studio</title>

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --brown: #8B5E3C;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--black);
      color: var(--white);
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h2 {
      color: var(--brown);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.5rem;
      max-width: 700px;
      margin: auto;
      line-height: 1.4;
    }

    .plans {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 50px 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 30px;
      width: 280px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--brown);
    }

    .card h3 {
      margin-bottom: 10px;
      color: var(--brown);
    }

    .price {
      font-size: 2rem;
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: var(--brown);
      color: var(--white);
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h2>P&J CREATIVE STUDIO</h2>
    <h1>we build websites, that build your business</h1>
  </header>

  <section class="plans">
    
    <div class="card">
      <h3>Basic Plan</h3>
      <p class="price">₱1,200</p>
      <p>Perfect for simple websites</p>
      <a href="#" class="btn">Get Started</a>
    </div>

    <div class="card">
      <h3>Pro Plan</h3>
      <p class="price">₱2,000</p>
      <p>For businesses that want more features</p>
      <a href="#" class="btn">Get Started</a>
    </div>

  </section>

  <footer>
    © 2026 P&J Creative Studio
  </footer>

</body>
</html>
